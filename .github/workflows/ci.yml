name: CI


on: [push, pull_request]


jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        working-directory: server-health-monitor
        run: |
          for f in script/*.sh script/lib/*.sh; do
            bash -n "$f"
          done
      - name: Run tests
        working-directory: server-health-monitor
        run: bash tests/run_tests.sh
